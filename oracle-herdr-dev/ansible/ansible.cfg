[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
result_format = yaml
# Facts are gathered once per run; nothing here is cached between runs.
gathering = smart
# Only ansible.builtin modules are used: no collections to install.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
