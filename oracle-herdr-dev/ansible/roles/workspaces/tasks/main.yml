---
# Herdr server + five workspaces. The script starts `herdr server` detached when
# none is running and only creates what is missing.
- name: Run bin/setup-workspaces
  ansible.builtin.command: "{{ repo_dir }}/bin/setup-workspaces"
  register: workspaces
  # The script logs what it creates/launches on stderr; "already ..." lines are no-ops.
  changed_when: >-
    workspaces.stderr is regex('created w[0-9]+|tab [a-z]+ -> w[0-9]+:t[0-9]+|dev panes:|: nvim \.|: opencode \(agent|: lazygit$|starting headless herdr server', multiline=True)
  environment:
    PATH: "{{ user_path }}"
    SHELL: /bin/bash
    LANG: C.UTF-8
  when: run_workspaces
