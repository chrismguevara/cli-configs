---
# Mirrors bin/install-dotfiles: symlinks into $HOME plus one source line in ~/.bashrc.
- name: Executables in bin/
  ansible.builtin.find:
    paths: "{{ repo_dir }}/bin"
    file_type: file
  register: bin_files

- name: Symlink targets
  ansible.builtin.set_fact:
    dotfile_links:
      - { src: "{{ repo_dir }}/dotfiles/bashrc", dest: "{{ home }}/.config/dev-shell/bashrc" }
      - { src: "{{ repo_dir }}/dotfiles/herdr/config.toml", dest: "{{ home }}/.config/herdr/config.toml" }
      - { src: "{{ repo_dir }}/dotfiles/nvim", dest: "{{ home }}/.config/nvim" }

- name: Parent directories
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfile_links }}"

- name: Existing non-symlink files
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ dotfile_links }}"
  register: dest_stats

- name: Back up pre-existing regular files/directories once (*.pre-dev-shell)
  ansible.builtin.command: mv {{ item.stat.path }} {{ item.stat.path }}.pre-dev-shell
  loop: "{{ dest_stats.results }}"
  loop_control:
    label: "{{ item.stat.path | default(item.item.dest) }}"
  when: item.stat.exists and not item.stat.islnk
  changed_when: true

- name: Symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfile_links }}"

- name: ~/.local/bin symlinks for bin/* executables
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ home }}/.local/bin/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ bin_files.files | selectattr('mode', 'search', '^0?7') | list }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: ~/.bashrc sources the fragment
  ansible.builtin.blockinfile:
    path: "{{ home }}/.bashrc"
    create: true
    mode: "0644"
    marker: "# {mark} dev-shell (oracle-herdr-dev) managed by ansible"
    block: |
      [ -f "$HOME/.config/dev-shell/bashrc" ] && . "$HOME/.config/dev-shell/bashrc"
